<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aqeel Zaman — Design & Editing Portfolio</title>
<meta name="description" content="Graphic design and video editing work by Aqeel Zaman.">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='16' fill='%239b8cff'/><text x='32' y='43' font-family='Helvetica,Arial' font-size='30' font-weight='bold' fill='%23fff' text-anchor='middle'>AZ</text></svg>">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Background layer (image is optional; see assets/background/README.md) -->
<div class="bg-layer" aria-hidden="true"></div>
<div class="bg-tint" aria-hidden="true"></div>

<a class="skip-link" href="#main">Skip to content</a>

<!-- ─────────────── Sidebar ─────────────── -->
<button class="menu-btn" id="menuBtn" aria-label="Open navigation" aria-expanded="false">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
</button>

<nav class="sidebar" id="sidebar" aria-label="Sections">
  <div class="sidebar-inner">
    <div class="sidebar-head">
      <span class="rail-mark" aria-hidden="true">AZ</span>
      <span class="sidebar-title">Contents</span>
    </div>
    <ul class="nav-list" id="navList"><!-- built by app.js --></ul>
    <div class="sidebar-foot">
      <button class="theme-btn" id="themeBtn" aria-label="Switch to light mode">
        <span class="theme-icon" aria-hidden="true">
          <svg class="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </span>
        <span class="theme-label">Dark mode</span>
      </button>
    </div>
  </div>
</nav>
<div class="scrim" id="scrim" hidden></div>

<!-- ─────────────── Main ─────────────── -->
<main id="main">

  <!-- Bio -->
  <header class="hero" id="top">
    <div class="hero-card reveal">
      <div class="hero-avatar" id="heroAvatar"></div>
      <div class="hero-text">
        <p class="hero-kicker" id="heroKicker"></p>
        <h1 class="hero-name" id="heroName"></h1>
        <p class="hero-tagline" id="heroTagline"></p>
        <div class="hero-bio" id="heroBio"></div>
        <div class="hero-links" id="heroLinks"></div>
      </div>
    </div>
    <div class="scroll-hint" aria-hidden="true">
      <span>scroll</span>
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
    </div>
  </header>

  <div id="sections"><!-- built by app.js --></div>

  <footer class="site-foot">
    <p id="footNote"></p>
    <button class="to-top" id="toTop">Back to top</button>
  </footer>
</main>

<!-- ─────────────── Lightbox ─────────────── -->
<div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Image viewer">
  <button class="lb-close" id="lbClose" aria-label="Close (Esc)">
    <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
  </button>
  <button class="lb-nav lb-prev" id="lbPrev" aria-label="Previous">
    <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <figure class="lb-figure">
    <img id="lbImg" alt="">
    <figcaption id="lbCap"></figcaption>
  </figure>
  <button class="lb-nav lb-next" id="lbNext" aria-label="Next">
    <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
  </button>
</div>

<script src="data/projects.js"></script>
<script src="js/app.js"></script>
</body>
</html>
